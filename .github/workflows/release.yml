name: Governed macOS release

on:
  push:
    tags: ["v*"]

concurrency:
  group: governed-macos-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - id: source
        name: Validate tag, main membership, and exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/release-contract.ts validate-source

  candidate:
    name: Build signed and notarized draft
    needs: validate
    runs-on: macos-15
    timeout-minutes: 90
    environment:
      name: macos-release
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_MAIN_CI_RUN_ID: ${{ needs.validate.outputs.ci_run_id }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Cargo dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: desktop-native-release
          workspaces: apps/desktop/src-tauri -> target
          save-if: false
      - name: Verify every released database fixture
        run: |
          set -euo pipefail
          tests="$(cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib -- --list)"
          if ! grep -q '^database::tests::release_compatibility::' <<< "$tests"; then
            echo 'The database compatibility release test is absent.' >&2
            exit 1
          fi
          cargo test \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --lib \
            'database::tests::release_compatibility::'
      - name: Record database compatibility evidence
        run: bun scripts/release-contract.ts database-evidence
      - name: Record presence-only release configuration
        env:
          RELEASE_HAS_APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER != '' }}
          RELEASE_HAS_APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID != '' }}
          RELEASE_HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          RELEASE_HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          RELEASE_HAS_APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY != '' }}
          RELEASE_HAS_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
          RELEASE_HAS_APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY != '' }}
          RELEASE_HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          RELEASE_HAS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          RELEASE_HAS_TOUCHGRASS_AUTH_SITE_URL: ${{ vars.TOUCHGRASS_AUTH_SITE_URL != '' }}
          RELEASE_HAS_TOUCHGRASS_CONVEX_URL: ${{ vars.TOUCHGRASS_CONVEX_URL != '' }}
        run: bun scripts/release-contract.ts presence
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install temporary notarization and provisioning material
        env:
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          private_directory="$RUNNER_TEMP/touchgrass-release-private"
          notary_key="$private_directory/AuthKey_${APPLE_API_KEY_ID}.p8"
          provisioning_profile="$private_directory/prod.provisionprofile"
          mkdir -p "$private_directory"
          printf '%s' "$APPLE_NOTARY_KEY" > "$notary_key"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$provisioning_profile"
          chmod 600 "$notary_key" "$provisioning_profile"
          printf 'APPLE_API_KEY_PATH=%s\n' "$notary_key" >> "$GITHUB_ENV"
          printf 'TOUCHGRASS_PROD_PROVISIONING_PROFILE=%s\n' "$provisioning_profile" >> "$GITHUB_ENV"
      - name: Prepare exact-version production configuration
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          CONVEX_SITE_URL: ${{ vars.TOUCHGRASS_AUTH_SITE_URL }}
          CONVEX_URL: ${{ vars.TOUCHGRASS_CONVEX_URL }}
        run: bun desktop:release --prepare
      - name: Build and sign the app, DMG, and updater archive
        env:
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          CONVEX_SITE_URL: ${{ vars.TOUCHGRASS_AUTH_SITE_URL }}
          CONVEX_URL: ${{ vars.TOUCHGRASS_CONVEX_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run --cwd apps/desktop tauri build --bundles app dmg --config src-tauri/.dev-instance/prod-tauri.conf.json
      - name: Independently notarize and verify release artifacts
        env:
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: bun scripts/finalize-macos-release.ts
      - name: Create the immutable-tag draft candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "release-output/TouchGrassBar_${version}_aarch64.dmg" \
            "release-output/TouchGrassBar_${version}_aarch64.app.tar.gz" \
            "release-output/TouchGrassBar_${version}_aarch64.app.tar.gz.sig" \
            "release-output/latest.json" \
            "release-output/SHA256SUMS" \
            "release-output/database-compatibility-${version}.json" \
            "release-output/release-trust-${version}.json" \
            --draft \
            --latest=false \
            --notes-file release-output/release-notes.md \
            --repo "$GITHUB_REPOSITORY" \
            --title "TouchGrassBar $RELEASE_TAG" \
            --verify-tag
      - if: ${{ always() }}
        name: Remove temporary release material
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/touchgrass-release-private"
          rm -rf apps/desktop/src-tauri/.dev-instance
          rm -rf release-output
