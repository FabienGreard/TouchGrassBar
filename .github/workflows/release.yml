name: Signed macOS release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: macos-15
    environment: macos-release
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag commit passed main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_commit="$(git rev-parse HEAD)"
          passed_commit="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow .github/workflows/ci.yml \
              --branch main \
              --event push \
              --commit "$tag_commit" \
              --status success \
              --limit 1 \
              --json headSha \
              --jq '.[0].headSha // ""'
          )"

          if [[ "$passed_commit" != "$tag_commit" ]]; then
            echo "::error::Release tag commit $tag_commit does not have a successful main CI run."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install notarization API key
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPLE_NOTARY_KEY" > "$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
      - name: Install production provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$APPLE_PROVISIONING_PROFILE_BASE64"
          mkdir -p apps/desktop/src-tauri/.dev-instance
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D \
            > apps/desktop/src-tauri/.dev-instance/prod.provisionprofile
          chmod 600 apps/desktop/src-tauri/.dev-instance/prod.provisionprofile
      - name: Configure signed update feed
        env:
          TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          jq --arg endpoint "$TAURI_UPDATER_ENDPOINT" --arg pubkey "$TAURI_UPDATER_PUBLIC_KEY" \
            '.plugins.updater.endpoints = [$endpoint] | .plugins.updater.pubkey = $pubkey' \
            apps/desktop/src-tauri/tauri.conf.json > "$RUNNER_TEMP/tauri.conf.json"
          mv "$RUNNER_TEMP/tauri.conf.json" apps/desktop/src-tauri/tauri.conf.json
      - name: Prepare production entitlement binding
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CONVEX_SITE_URL: ${{ secrets.TOUCHGRASS_AUTH_SITE_URL }}
          CONVEX_URL: ${{ secrets.TOUCHGRASS_CONVEX_URL }}
        run: bun desktop:release --prepare
      - name: Build, sign, notarize, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          CONVEX_SITE_URL: ${{ secrets.TOUCHGRASS_AUTH_SITE_URL }}
          CONVEX_URL: ${{ secrets.TOUCHGRASS_CONVEX_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/.dev-instance/prod-tauri.conf.json
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: TouchGrassBar ${{ github.ref_name }}
          releaseBody: |
            Signed and notarized macOS build.

            Manual release check:
            - [ ] Install and launch the app on macOS 15.
            - [ ] Review the panel, onboarding, and Settings windows at their default sizes.
            - [ ] Confirm that content is not clipped and that footer spacing is correct.
            - [ ] Publish this draft only after these checks pass.
          releaseDraft: true
          prerelease: false
      - name: Verify the published production bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CONVEX_SITE_URL: ${{ secrets.TOUCHGRASS_AUTH_SITE_URL }}
          CONVEX_URL: ${{ secrets.TOUCHGRASS_CONVEX_URL }}
        run: bun desktop:release --verify
