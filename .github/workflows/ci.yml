name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Run repository quality
        run: bun run quality:code

  native:
    name: Native app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Restore Cargo dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: desktop-native
          workspaces: apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - name: Verify native contract
        run: bun run contracts:check
      - name: Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Rust lints
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - if: github.event_name == 'push'
        name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Unsigned app smoke bundle
        if: github.event_name == 'push'
        run: bun run --cwd apps/desktop tauri build --bundles app

  required:
    name: Bun and Rust quality
    if: ${{ always() }}
    needs: [quality, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm required jobs passed
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$NATIVE_RESULT" = "success"
