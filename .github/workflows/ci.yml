name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Bun and Rust quality
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: JavaScript and TypeScript quality
        run: bun quality
      - name: Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - name: Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Rust lints
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Unsigned app smoke bundle
        run: bun run --cwd apps/desktop tauri build --bundles app
