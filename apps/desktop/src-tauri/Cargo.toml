[package]
name = "touchgrassbar"
version = "0.0.0"
description = "The native core for TouchGrassBar"
authors = ["TouchGrassBar contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "touchgrassbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", features = ["NSWindow"] }
