[package]
name = "touchgrassbar"
version = "0.0.0"
description = "The native core for TouchGrassBar"
authors = ["TouchGrassBar contributors"]
license = "MIT"
default-run = "touchgrassbar"
edition = "2024"
rust-version = "1.85"

[lib]
name = "touchgrassbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
convex = { version = "=0.10.4", default-features = false, features = ["rustls-tls-native-roots"] }
getrandom = "0.3"
libc = "=0.2.189"
minisign-verify = "=0.2.5"
portable-pty = "=0.9.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
schemars = "=1.2.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "=0.2.1"
tauri = { version = "=2.11.5", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
time = { version = "=0.3.45", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
unicode-normalization = "=0.1.25"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSAccessibilityProtocols", "NSButton", "NSControl", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString"] }
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
security-framework-sys = "=2.17.0"
