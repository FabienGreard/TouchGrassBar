[package]
name = "touchgrassbar-menubar-spike"
version = "0.0.0"
description = "TouchGrassBar Tauri menu-bar viability spike"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "touchgrassbar_menubar_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.11.5", features = ["tray-icon"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", features = ["NSWindow"] }
